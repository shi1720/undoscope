name: Reproduce and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra research --frozen
      - run: uv run python scripts/release_manifest.py --check
      - run: uv run pytest -q
      - run: uv run python scripts/audit_results.py
      - name: Verify deterministic enumeration
        run: |
          cp results/exhaustive.csv /tmp/exhaustive-recorded.csv
          uv run python scripts/run_exhaustive.py
          cmp results/exhaustive.csv /tmp/exhaustive-recorded.csv

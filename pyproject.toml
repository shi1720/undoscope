[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "undoscope"
version = "0.1.0"
description = "Effect-scoped compensation and an adversarial recovery benchmark for tool-using agents"
requires-python = ">=3.12"
authors = [{name = "Shivam Gupta"}]
license = "MIT"
dependencies = []

[project.optional-dependencies]
research = ["matplotlib==3.11.2", "numpy==2.5.3", "pytest==9.1.1", "hypothesis==6.168.1", "openai==3.19.0", "mcp==1.26.0"]

[project.scripts]
undoscope-demo = "undoscope.demo:main"
undoscope-mcp = "undoscope.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = ["httpx2==2.13.0", "httpcore2==2.13.0"]
